                rx="7"
            />

            <text
                x="1067"
                y="190"
                text-anchor="middle"
            >
                MA
            </text>

            <text
                class="callout-ev"
                x="1067"
                y="205"
                text-anchor="middle"
            >
                11
            </text>

        </g>


        <g
            id="callout-RI"
            class="state-callout"
            data-for-state="RI"
        >

            <rect
                x="1114"
                y="172"
                width="74"
                height="42"
                rx="7"
            />

            <text
                x="1151"
                y="190"
                text-anchor="middle"
            >
                RI
            </text>

            <text
                class="callout-ev"
                x="1151"
                y="205"
                text-anchor="middle"
            >
                4
            </text>

        </g>


        <g
            id="callout-CT"
            class="state-callout"
            data-for-state="CT"
        >

            <rect
                x="1030"
                y="224"
                width="74"
                height="42"
                rx="7"
            />

            <text
                x="1067"
                y="242"
                text-anchor="middle"
            >
                CT
            </text>

            <text
                class="callout-ev"
                x="1067"
                y="257"
                text-anchor="middle"
            >
                7
            </text>

        </g>


        <g
            id="callout-DE"
            class="state-callout"
            data-for-state="DE"
        >

            <rect
                x="1114"
                y="224"
                width="74"
                height="42"
                rx="7"
            />

            <text
                x="1151"
                y="242"
                text-anchor="middle"
            >
                DE
            </text>

            <text
                class="callout-ev"
                x="1151"
                y="257"
                text-anchor="middle"
            >
                3
            </text>

        </g>


        <g
            id="callout-NJ"
            class="state-callout"
            data-for-state="NJ"
        >

            <rect
                x="1030"
                y="276"
                width="74"
                height="42"
                rx="7"
            />

            <text
                x="1067"
                y="294"
                text-anchor="middle"
            >
                NJ
            </text>

            <text
                class="callout-ev"
                x="1067"
                y="309"
                text-anchor="middle"
            >
                14
            </text>

        </g>


        <g
            id="callout-MD"
            class="state-callout"
            data-for-state="MD"
        >

            <rect
                x="1114"
                y="276"
                width="74"
                height="42"
                rx="7"
            />

            <text
                x="1151"
                y="294"
                text-anchor="middle"
            >
                MD
            </text>

            <text
                class="callout-ev"
                x="1151"
                y="309"
                text-anchor="middle"
            >
                10
            </text>

        </g>

    </g>


    <!-- =====================================================
         MAINE ELECTORAL DISTRICT CONTROLS
         ===================================================== -->

    <g
        id="maine-electoral-districts"
        class="district-elector-group"
        transform="translate(915 560)"
    >

        <text
            class="district-title"
            x="0"
            y="-14"
        >
            Maine
        </text>


        <g
            id="ME-AL"
            class="district-elector"
            data-state="ME"
            data-electoral-votes="2"
        >

            <rect
                x="0"
                y="0"
                width="72"
                height="38"
                rx="6"
            />

            <text
                x="36"
                y="24"
                text-anchor="middle"
            >
                ME-AL
            </text>

        </g>


        <g
            id="ME-01"
            class="district-elector"
            data-state="ME"
            data-electoral-votes="1"
        >

            <rect
                x="80"
                y="0"
                width="72"
                height="38"
                rx="6"
            />

            <text
                x="116"
                y="24"
                text-anchor="middle"
            >
                ME-01
            </text>

        </g>


        <g
            id="ME-02"
            class="district-elector"
            data-state="ME"
            data-electoral-votes="1"
        >

            <rect
                x="160"
                y="0"
                width="72"
                height="38"
                rx="6"
            />

            <text
                x="196"
                y="24"
                text-anchor="middle"
            >
                ME-02
            </text>

        </g>

    </g>


    <!-- =====================================================
         NEBRASKA ELECTORAL DISTRICT CONTROLS
         ===================================================== -->

    <g
        id="nebraska-electoral-districts"
        class="district-elector-group"
        transform="translate(760 660)"
    >

        <text
            class="district-title"
            x="0"
            y="-14"
        >
            Nebraska
        </text>


        <g
            id="NE-AL"
            class="district-elector"
            data-state="NE"
            data-electoral-votes="2"
        >

            <rect
                x="0"
                y="0"
                width="72"
                height="38"
                rx="6"
            />

            <text
                x="36"
                y="24"
                text-anchor="middle"
            >
                NE-AL
            </text>

        </g>


        <g
            id="NE-01"
            class="district-elector"
            data-state="NE"
            data-electoral-votes="1"
        >

            <rect
                x="80"
                y="0"
                width="72"
                height="38"
                rx="6"
            />

            <text
                x="116"
                y="24"
                text-anchor="middle"
            >
                NE-01
            </text>

        </g>


        <g
            id="NE-02"
            class="district-elector"
            data-state="NE"
            data-electoral-votes="1"
        >

            <rect
                x="160"
                y="0"
                width="72"
                height="38"
                rx="6"
            />

            <text
                x="196"
                y="24"
                text-anchor="middle"
            >
