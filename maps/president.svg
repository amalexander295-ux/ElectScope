<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    id="electscope-president-map"
    viewBox="0 0 1200 760"
    role="img"
    aria-labelledby="map-title map-description"
>

    <title id="map-title">
        United States Presidential Election Map
    </title>

    <desc id="map-description">
        Interactive presidential election map for ElectScope.
    </desc>


    <!-- =====================================================
         MAP DEFINITIONS
         ===================================================== -->

    <defs>

        <filter
            id="state-shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >

            <feDropShadow
                dx="0"
                dy="2"
                stdDeviation="2"
                flood-opacity="0.12"
            />

        </filter>

    </defs>


    <!-- =====================================================
         MAP BACKGROUND
         ===================================================== -->

    <rect
        x="0"
        y="0"
        width="1200"
        height="760"
        rx="18"
        fill="#ffffff"
    />


    <!-- =====================================================
         MAP TITLE
         ===================================================== -->

    <g id="map-heading">

        <text
            x="55"
            y="58"
            fill="#182230"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
        >
            Electoral College
        </text>

        <text
            x="55"
            y="82"
            fill="#7a8596"
            font-family="Arial, Helvetica, sans-serif"
            font-size="12"
            font-weight="600"
        >
            Select a state to edit your map
        </text>

    </g>


    <!-- =====================================================
         CONTIGUOUS UNITED STATES

         Real geographic state paths will be inserted into
         this group.

         Each state will use this structure:

         <g
             id="state-TX"
             class="state-group"
             data-state="Texas"
             data-abbreviation="TX"
         >

             <path
                 class="state-shape"
                 d="..."
             />

             <text class="state-label">
                 TX
             </text>

             <text class="ev-label">
                 40
             </text>

         </g>

         Electoral votes are supplied by JavaScript rather
         than permanently encoded into the geography.
         ===================================================== -->

    <g
        id="continental-states"
        transform="translate(40 110)"
    >

        <!-- Accurate state paths go here next. -->

    </g>


    <!-- =====================================================
         ALASKA INSET

         No surrounding rectangle.
         ===================================================== -->

    <g
        id="state-AK"
        class="state-group inset-state"
        data-state="Alaska"
        data-abbreviation="AK"
        transform="translate(80 560)"
    >

        <path
            class="state-shape placeholder-state"
            d="
                M 10 70
                L 35 40
                L 70 28
                L 105 8
                L 132 24
                L 118 48
                L 142 61
                L 112 72
                L 83 64
                L 60 83
                L 30 78
                Z
            "
        />

        <text
            class="state-label"
            x="75"
            y="52"
            text-anchor="middle"
        >
            AK
        </text>

        <text
            class="ev-label"
            x="75"
            y="67"
            text-anchor="middle"
        >
            3
        </text>

    </g>


    <!-- =====================================================
         HAWAII INSET

         No giant surrounding rectangle.
         ===================================================== -->

    <g
        id="state-HI"
        class="state-group inset-state"
        data-state="Hawaii"
        data-abbreviation="HI"
        transform="translate(275 620)"
    >

        <g class="hawaii-islands">

            <ellipse
                class="state-shape"
                cx="8"
                cy="15"
                rx="7"
                ry="4"
            />

            <ellipse
                class="state-shape"
                cx="28"
                cy="22"
                rx="8"
                ry="5"
            />

            <ellipse
                class="state-shape"
                cx="50"
                cy="29"
                rx="9"
                ry="5"
            />

            <ellipse
                class="state-shape"
                cx="76"
                cy="38"
                rx="12"
                ry="7"
            />

        </g>

        <text
            class="state-label"
            x="38"
            y="67"
            text-anchor="middle"
        >
            HI
        </text>

        <text
            class="ev-label"
            x="38"
            y="82"
            text-anchor="middle"
        >
            4
        </text>

    </g>


    <!-- =====================================================
         DISTRICT OF COLUMBIA
         ===================================================== -->

    <g
        id="state-DC"
        class="state-group callout-state"
        data-state="District of Columbia"
        data-abbreviation="DC"
    >

        <line
            class="callout-line"
            x1="885"
            y1="410"
            x2="1030"
            y2="470"
        />

        <rect
            class="state-shape callout-box"
            x="1030"
            y="449"
            width="74"
            height="44"
            rx="7"
        />

        <text
            class="state-label"
            x="1067"
            y="468"
            text-anchor="middle"
        >
            DC
        </text>

        <text
            class="ev-label"
            x="1067"
            y="483"
            text-anchor="middle"
        >
            3
        </text>

    </g>


    <!-- =====================================================
         NORTHEAST CALLOUT AREA

         Tiny northeastern states can use these positions
         instead of microscopic labels inside the geography.
         ===================================================== -->

    <g id="northeast-callouts">

        <g
            id="callout-VT"
            class="state-callout"
            data-for-state="VT"
        >

            <rect
                x="1030"
                y="120"
                width="74"
                height="42"
                rx="7"
            />

            <text
                x="1067"
                y="138"
                text-anchor="middle"
            >
                VT
            </text>

            <text
                class="callout-ev"
                x="1067"
                y="153"
                text-anchor="middle"
            >
                3
            </text>

        </g>


        <g
            id="callout-NH"
            class="state-callout"
            data-for-state="NH"
        >

            <rect
                x="1114"
                y="120"
                width="74"
                height="42"
                rx="7"
            />

            <text
                x="1151"
                y="138"
                text-anchor="middle"
            >
                NH
            </text>

            <text
                class="callout-ev"
                x="1151"
                y="153"
                text-anchor="middle"
            >
                4
            </text>

        </g>


        <g
