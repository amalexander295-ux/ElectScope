    </g>


    <!-- =====================================================
         SVG STYLES
         ===================================================== -->

    <style>

        .state-shape {
            fill: #dce2e9;
            stroke: #ffffff;
            stroke-width: 2;
            vector-effect: non-scaling-stroke;
            cursor: pointer;
            transition:
                fill 0.18s ease,
                opacity 0.18s ease;
        }

        .state-group:hover .state-shape {
            fill: #c4ced9;
        }

        .state-label {
            fill: #25334a;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 800;
            pointer-events: none;
        }

        .ev-label {
            fill: #6c788a;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 700;
            pointer-events: none;
        }

        .callout-line {
            stroke: #aeb8c5;
            stroke-width: 1.5;
            fill: none;
        }

        .callout-box {
            stroke: #ffffff;
            stroke-width: 2;
        }

        .state-callout {
            cursor: pointer;
        }

        .state-callout rect {
            fill: #dce2e9;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .state-callout:hover rect {
            fill: #c4ced9;
        }

        .state-callout text {
            fill: #25334a;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 800;
            pointer-events: none;
        }

        .state-callout .callout-ev {
            fill: #6c788a;
            font-size: 9px;
        }

        .district-title {
            fill: #667085;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 800;
        }

        .district-elector {
            cursor: pointer;
        }

        .district-elector rect {
            fill: #dce2e9;
            stroke: #c7d0da;
            stroke-width: 1.5;
        }

        .district-elector:hover rect {
            fill: #c4ced9;
        }

        .district-elector text {
            fill: #25334a;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 800;
            pointer-events: none;
        }

        .state-group.democrat .state-shape,
        .state-callout.democrat rect,
        .district-elector.democrat rect {
            fill: #0375c9;
        }

        .state-group.republican .state-shape,
        .state-callout.republican rect,
        .district-elector.republican rect {
            fill: #c9062a;
        }

        .state-group.independent .state-shape,
        .state-callout.independent rect,
        .district-elector.independent rect {
            fill: #8c52c7;
        }

        .state-group.democrat .state-label,
        .state-group.democrat .ev-label,
        .state-group.republican .state-label,
        .state-group.republican .ev-label,
        .state-group.independent .state-label,
        .state-group.independent .ev-label,
        .state-callout.democrat text,
        .state-callout.republican text,
        .state-callout.independent text,
        .district-elector.democrat text,
        .district-elector.republican text,
        .district-elector.independent text {
            fill: #ffffff;
        }

    </style>

</svg>
